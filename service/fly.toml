app = "vox-pop-api"
primary_region = "nrt"

[build]

[env]
  PORT = "8000"
  VOXPOP_DB = "/data/voxpop.db"

[[mounts]]
  source = "voxpop_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      path = "/healthz"
      interval = "30s"
      timeout = "5s"
